<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>CRM — Kigali Business Directory</title>
<script src="crm-data.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
:root{--bg:#0d1117;--surface:#161b22;--card:#1c2128;--border:#30363d;--text:#e6edf3;--text2:#8b949e;--text3:#6e7681;--accent:#7c6aef;--accent2:#a78bfa;--green:#3fb950;--red:#f85149;--orange:#d29922;--link:#7c6aef}
body{background:var(--bg);color:var(--text);display:flex;height:100vh;overflow:hidden}
.side{width:195px;background:#0d1117;border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;z-index:10}
.side-h{padding:18px 16px 12px;border-bottom:1px solid var(--border)}
.side-h h1{font-size:18px;color:#fff}
.side-h span{font-size:11px;color:var(--accent2)}
.nav{flex:1;overflow-y:auto;padding:6px 0}
.nv{display:flex;align-items:center;gap:10px;padding:10px 16px;cursor:pointer;font-size:13px;color:var(--text2);transition:.12s;border-left:3px solid transparent}
.nv:hover{background:var(--card);color:var(--text)}
.nv.on{background:var(--card);color:#fff;border-color:var(--accent)}
.nv .ic{width:20px;text-align:center;font-size:16px}
.main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg)}
.top{display:flex;align-items:center;gap:10px;padding:10px 20px;border-bottom:1px solid var(--border);background:var(--surface);flex-wrap:wrap}
.top input{flex:1;min-width:160px;max-width:320px;padding:9px 14px;background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;outline:none}
.top input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,106,239,.15)}.top input::placeholder{color:var(--text3)}
.top select{padding:8px 12px;background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;outline:none;max-width:160px}
.top .inf{font-size:13px;color:var(--text2);white-space:nowrap}
.tbar{display:flex;gap:6px;align-items:center}
.tbar button{padding:7px 14px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text2);font-size:13px;cursor:pointer;transition:.12s;white-space:nowrap}
.tbar button:hover{border-color:var(--accent);color:var(--accent)}
.cx{flex:1;overflow:auto;padding:18px 22px}
.sr{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.sc{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 16px;cursor:pointer;transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sc:hover{border-color:var(--accent);box-shadow:0 3px 12px rgba(124,106,239,.15);transform:translateY(-1px)}
.sc .n{font-size:24px;font-weight:700;color:var(--text);line-height:1.2}
.sc .l{font-size:12px;color:var(--text2);margin-top:3px;font-weight:500}
.sc .n.r{color:var(--red)}.sc .n.g{color:var(--green)}.sc .n.b{color:var(--accent)}.sc .n.o{color:var(--orange)}
.fb{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.fb button{padding:6px 16px;border-radius:20px;border:1px solid var(--border);background:var(--card);color:var(--text2);font-size:13px;cursor:pointer;transition:.12s;white-space:nowrap}
.fb button:hover{border-color:var(--text3);color:var(--text)}
.fb button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.fb button .c{background:var(--surface);padding:1px 8px;border-radius:10px;font-size:11px;margin-left:5px;color:var(--text2)}
.fb button.on .c{background:rgba(255,255,255,.2);color:#fff}
.bbar{display:none;padding:10px 16px;background:rgba(124,106,239,.1);border:1px solid var(--accent);border-radius:10px;margin-bottom:10px;align-items:center;gap:12px;font-size:13px;color:var(--text)}
.bbar.on{display:flex}
.bbar select{padding:5px 10px;background:var(--card);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px;outline:none}
.bbar button{padding:6px 16px;border-radius:6px;border:none;cursor:pointer;font-size:13px;font-weight:500;background:var(--accent);color:#fff}
.bbar button:hover{background:var(--accent2)}
.tb{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.2)}
table{width:100%;border-collapse:collapse}
th{background:var(--surface);padding:9px 12px;text-align:left;font-size:11px;font-weight:700;text-transform:uppercase;color:var(--text2);cursor:pointer;border-bottom:2px solid var(--border);white-space:nowrap;user-select:none;letter-spacing:.4px}
th:hover{color:var(--accent)}
th .ar{margin-left:4px;font-size:10px;color:var(--accent)}
td{padding:8px 12px;font-size:13px;border-bottom:1px solid var(--border);color:var(--text);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--surface)}
tr.c{cursor:pointer}
tr.sel td{background:rgba(124,106,239,.1)}
.st{display:inline-block;padding:3px 10px;border-radius:10px;font-size:12px;font-weight:600;letter-spacing:.2px}
.st.wk{background:rgba(63,185,80,.15);color:var(--green)}
.st.br{background:rgba(210,153,34,.15);color:var(--orange)}
.st.nn{background:rgba(248,81,73,.15);color:var(--red)}
.sts{padding:5px 10px;background:var(--card);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px;cursor:pointer;outline:none}
.pg{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;font-size:13px;color:var(--text2)}
.pg .pb{display:flex;gap:4px}
.pg .pb button{min-width:32px;height:32px;border:1px solid var(--border);background:var(--card);border-radius:6px;cursor:pointer;font-size:12px;color:var(--text2);transition:.1s}
.pg .pb button:hover{border-color:var(--accent);color:var(--accent)}
.pg .pb button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.pg .pb button:disabled{opacity:.3;cursor:default}
.mo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;align-items:center;justify-content:center;backdrop-filter:blur(3px)}
.mo.on{display:flex}
.m{background:var(--card);border:1px solid var(--border);border-radius:14px;width:560px;max-width:92vw;max-height:90vh;overflow-y:auto;box-shadow:0 25px 80px rgba(0,0,0,.4);animation:up .2s}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.mh{padding:16px 22px 12px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start;position:sticky;top:0;background:var(--card);z-index:2}
.mh h2{font-size:17px;color:#fff}.mh .x{background:none;border:none;font-size:22px;color:var(--text3);cursor:pointer;padding:0 4px;line-height:1}.mh .x:hover{color:var(--text)}
.mb{padding:14px 22px}
.mb .rw{display:flex;padding:7px 0;border-bottom:1px solid var(--border);align-items:flex-start}
.mb .rw:last-child{border:none}
.mb .lbl{width:90px;font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.4px;flex-shrink:0;padding-top:2px}
.mb .val{font-size:14px;color:var(--text);word-break:break-word}
.mb .val a{color:var(--link);text-decoration:none}
.mb .val a:hover{text-decoration:underline}
.mf{padding:12px 22px;border-top:1px solid var(--border);display:flex;gap:8px;flex-wrap:wrap;position:sticky;bottom:0;background:var(--card)}
.mf button{padding:8px 18px;border-radius:8px;border:none;cursor:pointer;font-size:13px;font-weight:500;transition:.12s}
.mc{background:var(--green);color:#fff;font-weight:600}.mc:hover{background:#2ea043}
.me{background:var(--accent);color:#fff;font-weight:600}.me:hover{background:var(--accent2)}
.mw{background:var(--surface);color:var(--text2);border:1px solid var(--border)!important;font-weight:500}.mw:hover{background:var(--card);border-color:var(--text3)!important;color:var(--text)}
.ms{background:var(--orange);color:#fff;font-weight:600}.ms:hover{background:#bb8009}
.mb textarea{width:100%;margin-top:6px;padding:8px 12px;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;resize:vertical;min-height:50px;outline:none;font-family:inherit}
.mb textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,106,239,.1)}
.mb .svc{display:inline-block;padding:3px 10px;border-radius:6px;background:rgba(124,106,239,.15);color:var(--accent2);font-size:12px;margin:2px;font-weight:500}
#toast{position:fixed;bottom:24px;right:24px;background:var(--card);color:var(--text);padding:10px 20px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .25s;z-index:300;box-shadow:0 4px 20px rgba(0,0,0,.4);border:1px solid var(--border);pointer-events:none}
#toast.show{opacity:1}
.side .ftr{font-size:12px;color:var(--text3);text-align:center}
.side .ftr div{cursor:pointer;color:var(--accent);margin-bottom:5px}
.side .ftr div:hover{color:var(--accent2)}
.bar{height:22px;background:var(--surface);border-radius:6px;overflow:hidden;position:relative}
.bar .fill{height:100%;border-radius:6px;transition:width .4s}
.bar .fill.g{background:var(--green)}.bar .fill.b{background:var(--accent)}.bar .fill.o{background:var(--orange)}.bar .fill.r{background:var(--red)}
.bar .lbl{position:absolute;left:10px;top:0;font-size:12px;color:#fff;line-height:22px;white-space:nowrap;font-weight:600}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--text3)}
/* ─── TABLE → CARD VIEW (toggle-able on any screen) ─── */
.tb.card-view table,.tb.card-view thead,.tb.card-view tbody,.tb.card-view th,.tb.card-view td,.tb.card-view tr{display:block}
.tb.card-view thead{display:none}
.tb.card-view tbody{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;padding:0}
.tb.card-view tr{display:flex;flex-direction:column;justify-content:space-between;padding:14px;border:1px solid var(--border);border-radius:12px;background:var(--card);aspect-ratio:1;overflow:hidden;cursor:pointer;transition:all .15s;box-shadow:0 2px 6px rgba(0,0,0,.2);position:relative;border-top:3px solid var(--accent)}
.tb.card-view tr:hover{border-color:var(--accent);box-shadow:0 6px 20px rgba(124,106,239,.2);transform:translateY(-2px)}
.tb.card-view tr:last-child{border-bottom:1px solid var(--border)}
.tb.card-view td{border:none;padding:0;font-size:13px;width:auto;text-align:center;color:var(--text)}
.tb.card-view td:first-child{position:absolute;top:10px;right:10px}
.tb.card-view td:nth-child(2){width:100%;font-size:14px;font-weight:700;color:#fff;margin-bottom:6px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb.card-view td:nth-child(2) strong{font-size:14px;color:#fff}
.tb.card-view td:nth-child(3){font-size:10px;color:var(--accent2);background:rgba(124,106,239,.15);padding:3px 10px;border-radius:10px;display:inline-block;margin:0 auto 6px;font-weight:600;letter-spacing:.3px}
.tb.card-view td:nth-child(4){width:100%;font-size:11px;color:var(--text2);margin:auto 0 0;text-align:center;line-height:1.3}
.tb.card-view td:nth-child(5){font-size:12px;font-weight:600;color:var(--text);margin-bottom:4px}
.tb.card-view td:nth-child(6){margin:0 auto 6px}
.tb.card-view .st.wk{background:rgba(63,185,80,.15);color:var(--green)}
.tb.card-view .st.br{background:rgba(210,153,34,.15);color:var(--orange)}
.tb.card-view .st.nn{background:rgba(248,81,73,.15);color:var(--red)}
.tb.card-view td:nth-child(7){width:100%;margin-top:auto}
.tb.card-view td:nth-child(7) button{width:100%;padding:8px!important;font-size:13px!important;border-radius:8px!important;font-weight:600}
.tb.card-view tr td:nth-child(4){width:100%;text-align:center}
.tb.card-view td:last-child{margin-left:auto}

/* ─── MOBILE APP-LIKE RESPONSIVE ─── */
@media(max-width:768px){
  body{overflow:auto;background:var(--surface)}
  .side{position:fixed;top:0;left:-280px;width:260px;height:100vh;z-index:500;transition:left .28s cubic-bezier(.4,0,.2,1);box-shadow:4px 0 30px rgba(0,0,0,.15)}
  .side.open{left:0}
  .side-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:499;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
  .side-backdrop.open{display:block}
  .main{width:100%;padding-bottom:64px;min-height:100vh}
  .top{position:sticky;top:0;z-index:100;background:var(--card);padding:8px 12px;display:grid;grid-template-columns:1fr auto;gap:6px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
  .top input{grid-column:1/-1;min-width:0;max-width:none;font-size:16px;padding:10px 14px}
  .top select{font-size:16px;padding:10px 12px;max-width:none;width:100%}
  .top .inf{grid-column:1/-1;font-size:12px;text-align:center}
  .tbar{display:flex;gap:4px}
  .tbar button{padding:10px 14px;font-size:13px;min-height:44px}
  .ham{display:flex!important;align-items:center;justify-content:center;width:44px;height:44px;border:none;background:var(--surface);border-radius:10px;cursor:pointer;font-size:20px;color:var(--text);flex-shrink:0;order:-1}
  .ham:active{background:var(--border)}
  .cx{padding:12px!important;overflow:visible!important}
  .sr{grid-template-columns:repeat(2,1fr);gap:8px}
  .sc{padding:12px;border-radius:12px}
  .sc .n{font-size:20px}
  .fb{gap:4px;overflow-x:auto;flex-wrap:nowrap;padding-bottom:4px;-webkit-overflow-scrolling:touch}
  .fb button{flex-shrink:0;font-size:12px;padding:8px 14px;min-height:36px}
  .mo{align-items:flex-end}
  .mo.on{display:flex}
  .m{width:100%;max-width:100vw;max-height:92vh;border-radius:16px 16px 0 0;margin-top:auto;animation:slideUp .3s}
  @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
  .mh{padding:14px 18px 10px}
  .mh h2{font-size:15px}
  .mb{padding:10px 18px}
  .mb .rw{padding:6px 0}
  .mb .lbl{width:70px;font-size:10px}
  .mb .val{font-size:13px}
  .mf{padding:10px 18px 14px}
  .mf button{padding:12px 18px;font-size:14px;min-height:44px;flex:1}
  .pg{flex-direction:column;gap:8px;padding:10px}
  .pg .pb{width:100%;justify-content:center}
  .pg .pb button{min-width:36px;height:36px}
  #toast{bottom:80px;right:12px;left:12px;text-align:center;font-size:13px;padding:12px 16px}
  .bbar{padding:8px 12px;flex-wrap:wrap;border-radius:12px;margin:0 -4px 10px}
  .bbar select{flex:1;min-width:0}
  .bbar button{min-height:36px}
  .sts{font-size:16px;padding:8px 12px}
  /* Auto card view on small screens (fallback) */
  .tb tbody{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;padding:0}
  .tb tr{display:flex;flex-direction:column;justify-content:space-between;padding:12px;border:1px solid var(--border);border-radius:12px;background:var(--card);aspect-ratio:1;overflow:hidden;cursor:pointer;position:relative;border-top:3px solid var(--accent)}
  .tb tr:last-child{border-bottom:1px solid var(--border)}
  .tb td{border:none;padding:0;font-size:12px;width:auto;text-align:center;color:var(--text)}
  .tb td:first-child{position:absolute;top:8px;right:8px}
  .tb td:nth-child(2){width:100%;font-size:13px;font-weight:700;color:#fff;margin-bottom:4px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tb td:nth-child(2) strong{font-size:13px;color:#fff}
  .tb td:nth-child(3){font-size:10px;color:var(--accent2);background:rgba(124,106,239,.15);padding:2px 8px;border-radius:8px;display:inline-block;margin:0 auto 4px;font-weight:600}
  .tb td:nth-child(4){width:100%;font-size:11px;color:var(--text2);margin:auto 0 0;text-align:center}
  .tb td:nth-child(5){font-size:11px;font-weight:600;color:var(--text);margin-bottom:3px}
  .tb td:nth-child(6){margin:0 auto 4px}
  .tb td:nth-child(7){width:100%;margin-top:auto}
  .tb td:nth-child(7) button{width:100%;padding:8px!important;font-size:12px!important;border-radius:6px!important;font-weight:600}
  .tb tr td:nth-child(4){width:100%;text-align:center}
  .tb td:last-child{margin-left:auto}
  /* bottom tab bar */
  .btm-nav{position:fixed;bottom:0;left:0;right:0;z-index:200;background:var(--card);border-top:1px solid var(--border);display:flex;padding:4px 0 env(safe-area-inset-bottom,0);box-shadow:0 -2px 12px rgba(0,0,0,.2)}
  .btm-nav .bnv{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 2px 2px;cursor:pointer;font-size:10px;color:var(--text2);border:none;background:none;gap:1px;min-height:48px;-webkit-tap-highlight-color:transparent}
  .btm-nav .bnv .ic{font-size:18px;line-height:1.2}
  .btm-nav .bnv.on{color:var(--accent)}
  .btm-nav .bnv:active{background:var(--surface);border-radius:8px}
  ::-webkit-scrollbar{width:3px}
  .btm-nav .bnv{font-size:9px;padding:3px 1px}
  .btm-nav .bnv .ic{font-size:16px}
}
@media(min-width:769px){
  .ham,.btm-nav,.side-backdrop{display:none}
}
</style>
</head>
<body>

<div class="side" id="side">
  <div class="side-h"><h1>CRM</h1><span>2,750 Kigali Businesses</span>
  <div style="margin-top:8px;padding:6px 10px;background:#222248;border-radius:6px;font-size:11px;color:var(--text3)cee;line-height:1.4">
    <strong style="color:#fff">How to use:</strong><br>
    1. Pick a list below<br>
    2. Click a lead to see details<br>
    3. Call + log outcome
  </div>
</div>
  <div class="nav" id="nav"></div>
    <div class="ftr" style="padding:10px 16px;border-top:1px solid #2a2a4e">
    <div onclick="syncToAgent()" style="font-weight:600;font-size:12px;color:#8b85ff;margin-bottom:5px;cursor:pointer">&#128279; Sync to Call Agent</div>
    <div onclick="backup()" style="cursor:pointer;color:#8b85ff;margin-bottom:4px;font-size:11px">&#128190; Backup Data</div>
    <div onclick="document.getElementById('restoreInput').click()" style="cursor:pointer;color:#8b85ff;margin-bottom:0;font-size:11px">&#128194; Restore Data</div>
    <input type="file" id="restoreInput" accept=".json" style="display:none" onchange="restore(event)">
  </div>
</div>

<div class="side-backdrop" id="sideBackdrop" onclick="toggleSide()"></div>
<div class="main">
  <div class="top">
    <button class="ham" onclick="toggleSide()" aria-label="Menu">&#9776;</button>
    <input type="text" id="q" placeholder="Search name, category, email, phone, address..." oninput="doSearch()">
    <select id="catSel" onchange="doSearch()"><option value="">All Categories</option></select>
    <select id="pp" onchange="doSearch()"><option value="25">25</option><option value="50" selected>50</option><option value="100">100</option></select>
    <span class="inf" id="info"></span>
    <div class="tbar">
      <button onclick="toggleView()" id="viewBtn" title="Toggle table/card view">&#9638; Card</button>
      <button onclick="exportCSV()" title="Export filtered results as CSV">&#128229; CSV</button>
      <button onclick="clearFilters()" title="Clear all filters">&#10005; Clear</button>
    </div>
  </div>
  <div class="cx" id="cx"></div>
</div>

<div class="mo" id="mo" onclick="if(event.target===this)closeM()">
  <div class="m">
    <div class="mh"><h2 id="mt"></h2><button class="x" onclick="closeM()">&#10005;</button></div>
    <div class="mb" id="mb"></div>
    <div class="mf" id="mf"></div>
  </div>
</div>
<div id="toast"></div>

<div class="btm-nav" id="btmNav"></div>

<script>
// ═══════════════════════════════════════
// STATE
// ═══════════════════════════════════════
const ST = ['New','Called','Contacted','Interested','Not Interested','Follow Up','Closed Won','Closed Lost'];
let tab = 'prospect', sc = 'urgency', sd = 1, pg = 0, pp = 50, sq = '', sf = '', lk = 'hot-leads', ck = '', sk = '';
let sv = JSON.parse(localStorage.getItem('crm') || '{}');
let sel = new Set();
let pipeFilter = '';
let viewMode = window.innerWidth <= 768 ? 'card' : 'table';
window._svcSearchVal = '';
window._svcSort = 'count';
window._leadSearchVal = '';

// ─── Helper: HTML-escape a string for use in onclick or text ───
function esc(v) { return (v || '').toString().replace(/&/g,'&amp;').replace(/'/g,'&#39;').replace(/"/g,'&quot;'); }
function toggleSide() { document.getElementById('side').classList.toggle('open'); document.getElementById('sideBackdrop').classList.toggle('open'); }
function closeSide() { document.getElementById('side').classList.remove('open'); document.getElementById('sideBackdrop').classList.remove('open'); }
// ─── Helper: encode for localStorage key (remove special chars) ───
function key(v) { return v.replace(/[&\/\\'",.<>]/g,'').replace(/\s+/g,'_'); }

function sl(id, k, v) { if(!sv[id]) sv[id]={}; sv[id][k]=v; sv[id].t=Date.now(); localStorage.setItem('crm',JSON.stringify(sv)); }

function timeAgo(dateStr) {
  if (!dateStr) return '';
  var diff = Date.now() - new Date(dateStr).getTime();
  var mins = Math.floor(diff / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return mins + 'm ago';
  var hrs = Math.floor(mins / 60);
  if (hrs < 24) return hrs + 'h ago';
  var days = Math.floor(hrs / 24);
  if (days < 30) return days + 'd ago';
  return new Date(dateStr).toLocaleDateString();
}

const STAGE_ORDER = {'New':0,'Called':1,'Contacted':2,'Interested':3,'Follow Up':4,'Closed Won':5,'Not Interested':6,'Closed Lost':7};

function urgencyScore(x) {
  var ld = sv[x.id] || {};
  var contacted = ld.status && ld.status !== 'New' ? 1 : 0;
  var priW = x.priority === 'high' ? 3 : x.priority === 'medium' ? 2 : 1;
  return contacted * 10000 - priW * 1000 + x.id;
}

function listFilter(key) {
  if (key === 'hot-leads') return x => x.needsWebsite && x.phone.length > 0;
  if (key === 'restaurants') return x => CRM_FOOD.includes(x.cat) && x.needsWebsite;
  if (key === 'hotels') return x => CRM_HOTEL.includes(x.cat);
  if (key === 'retail') return x => CRM_RETAIL.includes(x.cat);
  if (key === 'medical') return x => CRM_MEDICAL.includes(x.cat);
  if (key === 'tourism') return x => CRM_TOURISM.includes(x.cat);
  if (key === 'professionals') return x => CRM_PROF.includes(x.cat);
  if (key === 'beauty') return x => CRM_BEAUTY.includes(x.cat);
  if (key === 'automotive') return x => CRM_AUTO.includes(x.cat);
  if (key === 'no-website') return x => x.needsWebsite;
  if (key === 'easy-reach') return x => x.needsWebsite && x.email.length > 0 && x.phone.length > 0;
  return x => true;
}

function buildNav() {
  const items = [
    {i:'🔥',n:'Call Leads',k:'prospect'},{i:'📊',n:'Dashboard',k:'dashboard'},
    {i:'📋',n:'Directory',k:'all'},{i:'🔧',n:'Services',k:'assess'},
    {i:'📂',n:'Categories',k:'cats'},{i:'📈',n:'Pipeline',k:'pipe'},
    {i:'📉',n:'Reports',k:'reports'}
  ];
  // Sidebar nav
  document.getElementById('nav').innerHTML = items.map(x =>
    `<div class="nv ${tab===x.k?'on':''}" data-tab="${x.k}"><span class="ic">${x.i}</span>${x.n}</div>`
  ).join('');
  document.querySelectorAll('.nv[data-tab]').forEach(el => {
    el.onclick = () => { goTab(el.dataset.tab); closeSide(); };
  });
  // Bottom nav
  // Show only first 5 items on bottom for space
  var btmItems = items.slice(0,5);
  document.getElementById('btmNav').innerHTML = btmItems.map(x =>
    `<div class="bnv ${tab===x.k?'on':''}" data-tab="${x.k}"><span class="ic">${x.i}</span>${x.n}</div>`
  ).join('');
  document.querySelectorAll('.btm-nav .bnv').forEach(el => {
    el.onclick = () => goTab(el.dataset.tab);
  });
  // Build category dropdown once
  const catSel = document.getElementById('catSel');
  if (catSel.options.length <= 1) {
    const catNames = new Set(CRM_CATS.map(([c]) => c));
    const themed = new Set();
    CAT_THEMES.forEach(function(theme) {
      const matching = theme.cats.filter(function(c) { return catNames.has(c); });
      if (matching.length === 0) return;
      const group = document.createElement('optgroup');
      group.label = theme.label;
      matching.forEach(function(c) {
        const opt = document.createElement('option');
        opt.value = c;
        opt.textContent = c;
        group.appendChild(opt);
        themed.add(c);
      });
      catSel.appendChild(group);
    });
    // Remaining categories not in any theme
    const remaining = CRM_CATS.filter(function([c]) { return !themed.has(c); });
    if (remaining.length > 0) {
      const group = document.createElement('optgroup');
      group.label = 'Other';
      remaining.forEach(function([c]) {
        const opt = document.createElement('option');
        opt.value = c;
        opt.textContent = c;
        group.appendChild(opt);
      });
      catSel.appendChild(group);
    }
  }
}

function getData() {
  let d = [...CRM];
  if (lk) d = d.filter(listFilter(lk));
  if (ck) d = d.filter(x => x.cat === ck);
  if (sk) { const q = sk.toLowerCase(); d = d.filter(x => x.services.toLowerCase().includes(q)); }
  if (sf === 'email') d = d.filter(x => x.email.length > 0);
  else if (sf) d = d.filter(x => x.ws === sf);
  if (sq) { const q = sq.toLowerCase(); d = d.filter(x => x.name.toLowerCase().includes(q)||x.cat.toLowerCase().includes(q)||x.email.toLowerCase().includes(q)||x.phone.includes(q)||x.address.toLowerCase().includes(q)); }
  return d;
}

// ═══════════════════════════════════════
// MAIN RENDER
// ═══════════════════════════════════════
function render() {
  let d = getData(); pp = parseInt(document.getElementById('pp').value);
  d.sort((a,b) => {
    if(sc==='urgency') return (urgencyScore(a) - urgencyScore(b)) * sd;
    if(sc==='id') return (a.id-b.id)*sd;
    return ((a[sc]||'').toString().localeCompare((b[sc]||'').toString()))*sd;
  });
  const ps = Math.ceil(d.length/pp); if(pg>=ps) pg=Math.max(0,ps-1);
  const st = pg*pp, en = Math.min(st+pp,d.length), pd = d.slice(st,en);
  document.getElementById('info').textContent = d.length + ' results';
  let h = '';
  if (tab === 'dashboard') h = dashView();
  else if (tab === 'prospect') h = prospectView(d, pd, st, en, ps);
  else if (tab === 'assess') h = assessView();
  else if (tab === 'cats') h = catsView();
  else if (tab === 'pipe') h = pipeView();
  else if (tab === 'reports') { document.getElementById('cx').innerHTML = '<div style="text-align:center;padding:30px;color:var(--text2)">Loading reports...</div>'; reportsView(); return; }
  else h = tableView(d, pd, st, en, ps);
  document.getElementById('cx').innerHTML = h;
  // Apply card/table view class
  document.querySelectorAll('.tb').forEach(function(el) {
    el.classList.toggle('card-view', viewMode === 'card');
  });
  updateViewBtn();
}

  h += '<select id="bulkSt">' + ST.map(s => '<option value="' + s + '">' + s + '</option>').join('') + '</select>';

  h += '</div>';
  // Table
  h += '<div class="tb"><table><thead><tr>';

  h += '<th onclick="setSC(\'name\')">Business<span class="ar">' + (sc==='name'?(sd===1?'&#9650;':'&#9660;'):'') + '</span></th>';
  h += '<th>Category</th>';
  h += '<th style="min-width:180px">Last Contact</th>';
  h += '<th>Phone</th>';
  h += '<th>Status</th>';
  h += '<th style="width:70px;text-align:center">Call</th>';
  h += '</tr></thead><tbody>';
  if (d.length===0) h += '<tr><td colspan="7"><div style="text-align:center;padding:30px;color:var(--text2);font-size:13px">No leads match these filters</div></td></tr>';
  else pd.forEach(function(x) {
    var priBorder = x.priority === 'high' ? 'border-top-color:#c62828' : x.priority === 'medium' ? 'border-top-color:#e65100' : '';
    var priLabel = x.priority === 'high' ? '<span style="color:#c62828;font-weight:700;font-size:11px">HIGH</span>' : x.priority === 'medium' ? '<span style="color:#e65100;font-weight:600;font-size:11px">MED</span>' : '<span style="color:#6c7a89;font-size:11px;font-weight:500">LOW</span>';
    var ld = sv[x.id] || {};
    var lastContact = '';
    if (ld.lastOutcome) {
      var oc = ld.lastOutcome.outcome;
      var ocColor = oc==='Interested'?'#43a047':oc==='Not Interested'||oc==='No Answer'||oc==='Wrong Number'?'#e53935':'#fb8c00';
      var ago = ld.called ? timeAgo(ld.called) : '';

      lastContact = '<span style="color:var(--text2);font-size:12px">Called</span><div style="font-size:11px;color:var(--text3);margin-top:1px">' + timeAgo(ld.called) + '</div>';
    } else {

    h += '<tr class="c" onclick="openM(' + x.id + ')" style="' + priBorder + '">';

    h += '<button onclick="goP(' + (ps-1) + ')"' + (pg>=ps-1?' disabled':'') + '>\u00bb</button>';
    h += '</div></div>';
  }
  return h + '</div>';
}

// ═══════════════════════════════════════
// PIPELINE
// ═══════════════════════════════════════
function pipeView() {
  // Collect all pipeline leads
  var pipeLeads = [];
  CRM.forEach(function(x) {
    var ld = sv[x.id];
    if (!ld?.status) return;
    pipeLeads.push({ lead: x, status: ld.status, stageOrder: STAGE_ORDER[ld.status] || 99, lastCalled: ld.called || '' });
  });
  // Sort by stage order, then by last called (oldest first = most urgent to follow up)
  pipeLeads.sort(function(a, b) {
    if (a.stageOrder !== b.stageOrder) return a.stageOrder - b.stageOrder;
    return (a.lastCalled || '').localeCompare(b.lastCalled || '');
  });
  // Filter by pipeFilter if set
  if (pipeFilter) {
    pipeLeads = pipeLeads.filter(function(p) { return p.status === pipeFilter; });
  }
  // Stat cards
  var stageCounts = {};
  ST.forEach(function(s) { stageCounts[s] = 0; });
  CRM.forEach(function(x) {
    var ld = sv[x.id];
    if (ld?.status && stageCounts[ld.status] !== undefined) stageCounts[ld.status]++;
  });
  var newCount = CRM.filter(function(x) { return !sv[x.id] || !sv[x.id].status; }).length;
  let h = '<div class="sr">';
  ST.forEach(function(s) {
    var cnt = s === 'New' ? newCount : stageCounts[s];
    var c = s==='Closed Won'?'#4caf50':s==='New'?'#4a6cf7':s==='Not Interested'||s==='Closed Lost'?'#f44336':'#ff9800';
    var isActive = pipeFilter === s;
    h += '<div class="sc' + (isActive ? ' active' : '') + '" onclick="togglePipeFilter(\'' + s + '\')" style="' + (isActive ? 'border-color:' + c + ';box-shadow:0 0 0 2px ' + c + '33' : '') + '"><div class="n" style="color:' + c + ';font-size:13px">' + cnt + '</div><div class="l">' + s + '</div></div>';
  });
  h += '</div>';
  if (pipeFilter) {
    h += '<div style="margin-bottom:8px;display:flex;align-items:center;gap:8px"><span style="font-size:12px;color:var(--text2)">Showing: <strong style="color:var(--text)">' + pipeFilter + '</strong></span><button onclick="pipeFilter=\'\';render()" style="padding:3px 10px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text2);font-size:11px;cursor:pointer">Clear filter</button></div>';
  }
  // Pagination
  var totalPages = Math.ceil(pipeLeads.length / pp);
  if (pg >= totalPages) pg = Math.max(0, totalPages - 1);
  var start = pg * pp, end = Math.min(start + pp, pipeLeads.length);
  var pageData = pipeLeads.slice(start, end);
  if (pipeLeads.length === 0) {
    h += '<div style="text-align:center;padding:40px;color:var(--text2)">';
    h += '<div style="font-size:40px;margin-bottom:10px">&#128200;</div>';
    h += '<div style="color:var(--text);font-size:16px;font-weight:600">' + (pipeFilter ? 'No leads with status: ' + pipeFilter : 'No leads in pipeline yet') + '</div>';
    h += '<div>' + (pipeFilter ? 'Try selecting a different status above' : 'Call leads from the Call Leads tab to add them here') + '</div>';
    h += '</div>';
  } else {
    h += '<div class="tb"><table><thead><tr><th>Business</th><th>Category</th><th>Status</th><th>Last Activity</th></tr></thead><tbody>';
    pageData.forEach(function(p) {
      var x = p.lead, ld = sv[x.id];
      var lastAct = ld.called ? timeAgo(ld.called) : '\u2014';
      var statusColor = STAGE_ORDER[ld.status] <= 2 ? '#ff9800' : STAGE_ORDER[ld.status] <= 4 ? '#4caf50' : STAGE_ORDER[ld.status] === 5 ? '#4caf50' : '#f44336';
      h += '<tr class="c" onclick="openM(' + x.id + ')">';
      h += '<td style="color:var(--text);font-size:12px"><strong>' + esc(x.name) + '</strong></td>';
      h += '<td style="color:var(--text2);font-size:11px">' + esc(x.cat) + '</td>';
      h += '<td style="font-size:12px"><span style="color:' + statusColor + ';font-weight:600">' + esc(ld.status) + '</span></td>';
      h += '<td style="font-size:12px;color:var(--text2)">' + lastAct + '</td>';
      h += '</tr>';
    });
    h += '</tbody></table>';
    if (totalPages > 1) {
      var pSt = Math.max(0, pg - 2), pEn = Math.min(totalPages, pSt + 5);
      h += '<div class="pg"><span>' + (start + 1) + '-' + end + ' of ' + pipeLeads.length + '</span><div class="pb">';
      h += '<button onclick="goP(0)"' + (pg === 0 ? ' disabled' : '') + '>\u00ab</button>';
      h += '<button onclick="goP(' + (pg - 1) + ')"' + (pg === 0 ? ' disabled' : '') + '>\u2039</button>';
      for (var i = pSt; i < pEn; i++) h += '<button class="' + (i === pg ? 'on' : '') + '" onclick="goP(' + i + ')">' + (i + 1) + '</button>';
      h += '<button onclick="goP(' + (pg + 1) + ')"' + (pg >= totalPages - 1 ? ' disabled' : '') + '>\u203a</button>';
      h += '<button onclick="goP(' + (totalPages - 1) + ')"' + (pg >= totalPages - 1 ? ' disabled' : '') + '>\u00bb</button>';
      h += '</div></div>';
    }
    h += '</div>';
  }
  return h;
}

function togglePipeFilter(status) {
  pipeFilter = pipeFilter === status ? '' : status;
  pg = 0;
  render();
}

  var h = '<div style="margin-bottom:8px;font-size:12px;color:var(--text2);text-align:center">Loading call agent data...</div>';

  // Try to fetch agent call data
  var agentData = null;
  var agentLogs = [];

  function finish() {
    var h = '';
    var total = CRM.length;
    var called = Object.keys(sv).length;
    var won = Object.values(sv).filter(function(x){return x.status==='Closed Won';}).length;
    var intd = Object.values(sv).filter(function(x){return x.status==='Interested'||x.status==='Follow Up';}).length;
    var notint = Object.values(sv).filter(function(x){return x.status==='Not Interested'||x.status==='Closed Lost';}).length;
    
    // LOCAL CALL DATA from saved outcomes
    var localCalls = [];
    var localOutcomes = {};
    var localApptCount = 0;
    var localDurationTotal = 0;
    var localDurationCount = 0;
    var localObjCounts = {};
    
    Object.keys(sv).forEach(function(id) {
      var ld = sv[id];

    document.getElementById('cx').innerHTML = h;

  // Fetch agent data

  setTimeout(function() { finish(); }, 3000);
}

// ─── CALL OUTCOME FORM ───
var callStartTime = null;

function doCall(id) {
  var x = CRM.find(function(d){return d.id===id;});
  if (!x || !x.phone) { showT('No phone number'); return; }
  
  sl(id,'status','Called'); sl(id,'called',new Date().toISOString());
  callStartTime = Date.now();
  
  // Open phone dialer directly (most reliable)
  window.open('tel:' + x.phone);
  showT('Calling ' + x.phone);
  closeM();
  
  // Show outcome form after the call (5s delay for them to finish)
  setTimeout(function() { showCallOutcomeForm(id); }, 5000);
}

function doAgentCall(id) {
  var x = CRM.find(function(d){return d.id===id;});
  if (!x || !x.phone) { showT('No phone number'); return; }
  
  sl(id,'status','Called'); sl(id,'called',new Date().toISOString());
  callStartTime = Date.now();
  
  var agentUrl = 'http://localhost:3000';
  closeM();
  
  // Show live tracking popup
  showCallTracker(id, 'Connecting to AI agent...');
  
  fetch(agentUrl + '/api/call-lead', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      phone: x.phone,
      business_name: x.name,
      industry: x.cat,
      crm_id: id,
      source: 'CRM'
    })
  })
  .then(function(r) {
    if (!r.ok) throw Error('Agent unreachable');
    return r.json();
  })
  .then(function(d) {
    updateCallTracker('Call initiated. Waiting for answer...');
    // Start polling for result
    pollCallStatus(id);
  })
  .catch(function() {
    updateCallTracker('Agent offline. Use regular Call button.', true);
    setTimeout(function() { closeCallTracker(); }, 3000);
  });
}

// ─── LIVE CALL TRACKER ───
var callTrackerInterval = null;
var callTrackerId = null;

function showCallTracker(id, msg) {
  callTrackerId = id;
  var existing = document.getElementById('call-tracker');
  if (existing) existing.remove();
  
  var div = document.createElement('div');
  div.id = 'call-tracker';
  div.innerHTML =
    '<div style="position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.4);z-index:250;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(3px)">' +
      '<div style="background:var(--card);border:1px solid var(--border);border-radius:14px;padding:28px 36px;width:380px;text-align:center;box-shadow:0 25px 80px rgba(0,0,0,.15);animation:up .2s">' +
        '<div id="ct-status" style="font-size:42px;margin-bottom:10px">&#128175;</div>' +
        '<div id="ct-title" style="font-size:16px;color:var(--text);font-weight:600;margin-bottom:4px">' + esc(CRM.find(function(d){return d.id===id;})?.name||'') + '</div>' +
        '<div id="ct-msg" style="font-size:13px;color:var(--text2);margin-bottom:16px">' + msg + '</div>' +
        '<div style="height:4px;background:var(--surface);border-radius:2px;overflow:hidden;margin-bottom:14px">' +
          '<div id="ct-bar" style="height:100%;width:0%;background:#6c63ff;border-radius:2px;transition:width 1s"></div>' +
        '</div>' +
        '<div id="ct-time" style="font-size:12px;color:var(--text3);margin-bottom:14px">Elapsed: 0s</div>' +
        '<button onclick="closeCallTracker()" style="padding:8px 20px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text2);cursor:pointer;font-size:13px">Cancel & Log Manually</button>' +
      '</div>' +
    '</div>';
  document.body.appendChild(div);
  
  // Animate bar
  var start = Date.now();
  callTrackerInterval = setInterval(function() {
    var elapsed = Math.floor((Date.now() - start) / 1000);
    var el = document.getElementById('ct-time');
    if (el) el.textContent = 'Elapsed: ' + elapsed + 's';
    var bar = document.getElementById('ct-bar');
    if (bar) {
      var pct = Math.min(elapsed / 120 * 100, 95);
      bar.style.width = pct + '%';
    }
    // Update status emoji periodically
    var st = document.getElementById('ct-status');
    if (st) {
      if (elapsed < 15) st.textContent = '\uD83D\uDC4B'; // waving
      else if (elapsed < 45) st.textContent = '\uD83D\uDCAC'; // talking
      else if (elapsed < 90) st.textContent = '\uD83D\uDCCB'; // wrapping up
      else st.textContent = '\u23F3'; // waiting
    }
  }, 1000);
}

function updateCallTracker(msg, isError) {
  var el = document.getElementById('ct-msg');
  if (el) el.textContent = msg;
  if (isError) {
    var st = document.getElementById('ct-status');
    if (st) st.textContent = '\u274C';
  }
}

function closeCallTracker() {
  if (callTrackerInterval) { clearInterval(callTrackerInterval); callTrackerInterval = null; }
  var el = document.getElementById('call-tracker');
  if (el) el.remove();
  if (callTrackerId) {
    showCallOutcomeForm(callTrackerId);
    callTrackerId = null;
  }
}

function pollCallStatus(id) {
  var agentUrl = 'http://localhost:3000';
  var attempts = 0;
  var maxAttempts = 60; // 5 min max
  
  var poller = setInterval(function() {
    attempts++;
    
    fetch(agentUrl + '/api/call-logs')
      .then(function(r) { if (!r.ok) throw Error(); return r.json(); })
      .then(function(logs) {
        // Find log matching our CRM lead
        var match = null;
        if (Array.isArray(logs)) {
          for (var i = 0; i < logs.length; i++) {
            var l = logs[i];
            var crmId = l.crm_id || (l.metadata && l.metadata.crm_id) || '';
            var phone = l.phone || '';
            if (crmId == id || (phone && CRM.find(function(d){return d.id===id;})?.phone === phone)) {
              match = l;
              break;
            }
          }
        }
        
        if (match) {
          clearInterval(poller);
          updateCallTracker('Call completed! Processing...');
          document.getElementById('ct-status').textContent = '\u2705';
          document.getElementById('ct-bar').style.width = '100%';
          document.getElementById('ct-bar').style.background = '#4caf50';
          
          // Save agent outcome to localStorage
          var outcome = match.outcome || {};
          if (typeof outcome === 'string') outcome = { outcome: outcome };
          var agentResult = {
            outcome: outcome.outcome === 'interested' ? 'Interested' :
                     outcome.outcome === 'not interested' ? 'Not Interested' :
                     outcome.outcome === 'callback requested' ? 'Callback' :
                     outcome.outcome === 'no answer' ? 'No Answer' : 'Follow Up',
            duration_minutes: match.duration_minutes || Math.round((match.duration_seconds||0)/60) || 2,
            appointment_booked: match.appointment_booked || false,
            appointment_date: match.appointment_date || '',
            appointment_time: match.appointment_time || '',
            notes: (typeof outcome === 'object' ? outcome.notes || '' : '') + ' (from AI call)',
            objections: outcome.objections || [],
            from_agent: true,
            agent_call_id: match.call_id || '',
            recording_url: match.recording_url || '',
          };
          sl(id, 'status', agentResult.outcome);
          sl(id, 'lastOutcome', agentResult);
          sl(id, 'called', new Date().toISOString());
          if (!sv[id].calls) sv[id].calls = [];
          sv[id].calls.push(agentResult);
          sv[id].t = Date.now();
          localStorage.setItem('crm', JSON.stringify(sv));
          
          setTimeout(function() {
            closeCallTracker();
            showT('AI call completed: ' + agentResult.outcome);
            render();
          }, 1500);
        } else if (attempts >= maxAttempts) {
          clearInterval(poller);
          updateCallTracker('No result received. Log manually.', true);
          setTimeout(function() { closeCallTracker(); }, 2000);
        } else {
          updateCallTracker('AI is talking to the lead... (' + (attempts * 5) + 's)');
        }
      })
      .catch(function() {
        if (attempts >= maxAttempts) {
          clearInterval(poller);
          updateCallTracker('Agent disconnected. Log manually.', true);
          setTimeout(function() { closeCallTracker(); }, 2000);
        }
      });
  }, 5000);
}

function saveCallOutcome(id) {
  var outcome = document.getElementById('co-outcome').value;
  var duration = parseInt(document.getElementById('co-duration').value) || 0;
  var apptBooked = document.getElementById('co-appt').checked;
  var apptDate = document.getElementById('co-appt-date-val').value || '';
  var apptTime = document.getElementById('co-appt-time-val').value || '';
  var notes = document.getElementById('co-notes').value || '';
  var objections = [];
  document.querySelectorAll('.co-obj:checked').forEach(function(el) { objections.push(el.value); });
  
  // Build call record
  var callRecord = {
    outcome: outcome,
    duration_minutes: duration,
    appointment_booked: apptBooked,
    appointment_date: apptDate,
    appointment_time: apptTime,
    objections: objections,
    notes: notes,
    called_at: new Date().toISOString(),
  };
  
  // Save to lead
  sl(id, 'status', outcome);
  sl(id, 'lastOutcome', callRecord);
  sl(id, 'called', new Date().toISOString());
  
  // Append to calls array
  if (!sv[id].calls) sv[id].calls = [];
  sv[id].calls.push(callRecord);
  sv[id].t = Date.now();
  localStorage.setItem('crm', JSON.stringify(sv));
  
  callInProgressId = null;
  callStartTime = null;
  
  closeM(); render();
  showT('Outcome saved: ' + outcome);
}

function toggleAll() {
  const d = getData(), pp2 = parseInt(document.getElementById('pp').value);

// ─── EXPORT ───
function exportCSV() {
  const d = getData();
  let csv = 'ID,Business Name,Category,Email,Phone,Website,Website Status,Address\n';
  d.forEach(function(x) {
    var esc2 = function(s) { return '"' + (s||'').replace(/"/g,'""') + '"'; };
    csv += x.id + ',' + esc2(x.name) + ',' + esc2(x.cat) + ',' + esc2(x.email) + ',' + esc2(x.phone) + ',' + esc2(x.website) + ',' + x.ws + ',' + esc2(x.address) + '\n';
  });
  const blob = new Blob([csv], {type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'crm-export-' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
  showT('Exported ' + d.length + ' leads');
}

// ─── BACKUP / RESTORE ───
function backup() {
  const blob = new Blob([JSON.stringify(sv,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'crm-backup-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  showT('Backup downloaded');
}
function restore(e) {
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = function() {
    try { sv = JSON.parse(reader.result); localStorage.setItem('crm', JSON.stringify(sv)); showT('Data restored (' + Object.keys(sv).length + ' leads)'); render(); }
    catch(e2) { showT('Invalid backup file'); }
  };
  reader.readAsText(file);
  e.target.value = '';
}

function showT(m) { const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(function(){t.classList.remove('show');},1600); }

// ─── SYNC TO CALL AGENT ───
function syncToAgent() {
  const agentUrl = 'http://localhost:3000/crm/sync-statuses';
  
  // Build statuses from localStorage
  const statuses = {};
  for (const id in sv) {
    if (sv.hasOwnProperty(id)) {
      const item = CRM.find(function(x){return x.id == id;});
      statuses[id] = {
        phone: item ? item.phone : '',
        name: item ? item.name : '',
        status: sv[id].status || 'new',
        notes: sv[id].notes || '',
        calledAt: sv[id].called || '',
        saved: sv[id].saved || false
      };
    }
  }
  
  // Add all uncontacted leads as "new"
  CRM.forEach(function(x) {
    if (!statuses[x.id]) {
      statuses[x.id] = { phone: x.phone, name: x.name, status: 'new', notes: '', saved: false };
    }
  });
  
  showT('Sending ' + Object.keys(statuses).length + ' lead statuses...');
  
  // Try posting to call-agent dashboard
  fetch(agentUrl, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ statuses: statuses })
  })
  .then(function(r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  })
  .then(function(d) {
    showT('Sent ' + d.message + ' to call agent');
  })
  .catch(function(err) {
    // Fallback: download as JSON file
    showT('Agent not running. Downloading file...');
    var blob = new Blob([JSON.stringify(statuses, null, 2)], {type:'application/json'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'crm-sync.json';
    a.click();
    showT('Downloaded crm-sync.json. Place in project folder & run: python sync_to_call_agent.py');
  });
}
