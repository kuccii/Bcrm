<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Website Verification System</title>
<script src="verify-progress.json" id="verifyData" type="application/json"></script>
<script src="dashboard-data.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:#0f1117; color:#e0e0e0; }

.top { background:#1a1d2e; border-bottom:1px solid #2a2d3e; padding:14px 24px; display:flex; align-items:center; gap:16px; position:sticky; top:0; z-index:100; }
.top h1 { font-size:17px; color:#fff; }
.top .sub { font-size:12px; color:#888; }

.wrap { display:flex; min-height:calc(100vh - 53px); }

.side { width:220px; background:#151827; border-right:1px solid #2a2d3e; flex-shrink:0; padding:12px 0; overflow-y:auto; }
.side-item { padding:10px 16px; cursor:pointer; font-size:13px; color:#aaa; border-left:3px solid transparent; display:flex; justify-content:space-between; }
.side-item:hover { background:#1e2136; }
.side-item.active { border-color:#4FC3F7; color:#4FC3F7; background:#1a1d2e; font-weight:600; }
.side-item .badge { background:#2a2d3e; padding:1px 8px; border-radius:8px; font-size:10px; color:#999; }
.side-item.active .badge { background:#4FC3F7; color:#0f1117; }

.main { flex:1; padding:20px; min-width:0; }

.stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; margin-bottom:16px; }
.stat { background:#1a1d2e; border:1px solid #2a2d3e; border-radius:10px; padding:14px 16px; cursor:pointer; transition:.15s; }
.stat:hover { border-color:#4FC3F7; }
.stat .num { font-size:22px; font-weight:700; color:#fff; }
.stat .lbl { font-size:11px; color:#777; margin-top:2px; }
.stat .num.green { color:#66BB6A; } .stat .num.red { color:#ef5350; } .stat .num.blue { color:#4FC3F7; } .stat .num.orange { color:#FFA726; }

.ctrl { background:#1a1d2e; border:1px solid #2a2d3e; border-radius:10px; padding:10px 16px; margin-bottom:14px; display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.ctrl input { flex:1; min-width:160px; padding:8px 12px; background:#0f1117; border:1px solid #2a2d3e; border-radius:6px; color:#e0e0e0; font-size:13px; outline:none; }
.ctrl input:focus { border-color:#4FC3F7; }
.ctrl input::placeholder { color:#555; }
.ctrl select { padding:8px 12px; background:#0f1117; border:1px solid #2a2d3e; border-radius:6px; color:#e0e0e0; font-size:12px; outline:none; }
.ctrl .count { font-size:12px; color:#666; margin-left:auto; white-space:nowrap; }

.pill { display:inline-block; padding:2px 10px; border-radius:20px; font-size:11px; font-weight:600; }
.pill.found { background:rgba(102,187,106,0.12); color:#66BB6A; }
.pill.not_found { background:rgba(239,83,80,0.12); color:#ef5350; }
.pill.skipped { background:rgba(79,195,247,0.12); color:#4FC3F7; }
.pill.pending { background:rgba(255,167,38,0.12); color:#FFA726; }

.tw { background:#1a1d2e; border:1px solid #2a2d3e; border-radius:10px; overflow:hidden; }
table { width:100%; border-collapse:collapse; }
th { background:#151827; padding:9px 12px; text-align:left; font-size:10px; font-weight:700; text-transform:uppercase; color:#666; cursor:pointer; border-bottom:1px solid #2a2d3e; }
th:hover { color:#4FC3F7; }
td { padding:8px 12px; font-size:13px; border-bottom:1px solid #222; color:#ccc; }
tr:hover td { background:#1e2136; }
tr.c { cursor:pointer; }

.website-input { background:#0f1117; border:1px solid #2a2d3e; border-radius:4px; padding:4px 8px; color:#4FC3F7; font-size:12px; width:100%; outline:none; }
.website-input:focus { border-color:#4FC3F7; }
.website-input.correct { border-color:#66BB6A; }

.save-btn { padding:3px 12px; border-radius:4px; border:none; cursor:pointer; font-size:11px; font-weight:600; background:#2E7D32; color:#fff; }
.save-btn:hover { background:#1B5E20; }
.search-btn { padding:3px 12px; border-radius:4px; border:1px solid #2a2d3e; cursor:pointer; font-size:11px; background:transparent; color:#4FC3F7; }
.search-btn:hover { border-color:#4FC3F7; }

.pag { display:flex; justify-content:space-between; padding:12px 16px; border-top:1px solid #2a2d3e; font-size:12px; color:#666; align-items:center; }
.pag .btns { display:flex; gap:3px; }
.pag .btns button { min-width:30px; height:30px; border:1px solid #2a2d3e; background:#0f1117; border-radius:5px; cursor:pointer; font-size:11px; color:#aaa; }
.pag .btns button:hover { border-color:#4FC3F7; color:#4FC3F7; }
.pag .btns button.on { background:#4FC3F7; color:#0f1117; }
.pag .btns button:disabled { opacity:0.25; cursor:default; }

#toast { position:fixed; bottom:24px; right:24px; background:#222; color:#eee; padding:10px 20px; border-radius:8px; font-size:13px; opacity:0; transition:opacity .25s; pointer-events:none; z-index:300; }
#toast.show { opacity:1; }
</style>
</head>
<body>

<div class="top">
    <h1>Website Verification System</h1>
    <span class="sub" id="headerInfo"></span>
</div>

<div class="wrap">
    <div class="side">
        <div class="side-item active" data-v="all" onclick="setView('all',this)"><span>All Businesses</span><span class="badge" id="b-all"></span></div>
        <div class="side-item" data-v="pending" onclick="setView('pending',this)"><span>⏳ Pending</span><span class="badge" id="b-pending"></span></div>
        <div class="side-item" data-v="found" onclick="setView('found',this)"><span>✅ Verified</span><span class="badge" id="b-found"></span></div>
        <div class="side-item" data-v="not_found" onclick="setView('not_found',this)"><span>❌ Not Found</span><span class="badge" id="b-notfound"></span></div>
        <div class="side-item" data-v="needs_review" onclick="setView('needs_review',this)"><span>⚠ Needs Review</span><span class="badge" id="b-review"></span></div>
    </div>
    <div class="main" id="main"></div>
</div>

<div id="toast"></div>

<script>
// Load verify progress
let verifyData = {};
try { verifyData = JSON.parse(document.getElementById('verifyData').textContent); } catch(e) {}

// Build enriched data
let allData = DATA.map(d => {
    const v = verifyData[d.id] || {};
    return { ...d, vstatus: v.status || 'pending', vsource: v.source || '', vwebsite: v.website || '' };
});

let filtered = [...allData];
let view = 'all', searchQ = '', sortCol = 'id', sortDir = 1;
let page = 0, perPage = 25;
let edits = {};

function getStats() {
    return {
        all: allData.length,
        pending: allData.filter(d => d.vstatus === 'pending').length,
        found: allData.filter(d => d.vstatus === 'found').length,
        notfound: allData.filter(d => d.vstatus === 'not_found').length,
        skipped: allData.filter(d => d.vstatus === 'skipped').length
    };
}

function render() {
    const st = getStats();
    document.getElementById('headerInfo').textContent = `${st.found} verified | ${st.pending} pending`;
    document.getElementById('b-all').textContent = st.all;
    document.getElementById('b-pending').textContent = st.pending;
    document.getElementById('b-found').textContent = st.found;
    document.getElementById('b-notfound').textContent = st.notfound;
    document.getElementById('b-review').textContent = st.notfound + st.pending;

    // Filter
    filtered = allData.filter(d => {
        if (view === 'pending' && d.vstatus !== 'pending') return false;
        if (view === 'found' && d.vstatus !== 'found' && d.vstatus !== 'skipped') return false;
        if (view === 'not_found' && d.vstatus !== 'not_found') return false;
        if (view === 'needs_review' && d.vstatus !== 'pending' && d.vstatus !== 'not_found') return false;
        if (searchQ && !d.name.toLowerCase().includes(searchQ) && !d.cat.toLowerCase().includes(searchQ) && !d.email.toLowerCase().includes(searchQ)) return false;
        return true;
    });

    // Sort
    filtered.sort((a,b) => {
        if (sortCol === 'id') return (a.id - b.id) * sortDir;
        const va = (a[sortCol]||'').toString().toLowerCase(), vb = (b[sortCol]||'').toString().toLowerCase();
        return va.localeCompare(vb) * sortDir;
    });

    const pages = Math.ceil(filtered.length / perPage);
    if (page >= pages) page = Math.max(0, pages-1);
    const start = page * perPage, end = Math.min(start+perPage, filtered.length);
    const pageData = filtered.slice(start, end);

    // Stats cards
    let html = `<div class="stats">
        <div class="stat" onclick="setView('all',document.querySelector('[data-v=\"all\"]'))"><div class="num blue">${st.all}</div><div class="lbl">Total</div></div>
        <div class="stat" onclick="setView('found',document.querySelector('[data-v=\"found\"]'))"><div class="num green">${st.found + st.skipped}</div><div class="lbl">Verified</div></div>
        <div class="stat" onclick="setView('pending',document.querySelector('[data-v=\"pending\"]'))"><div class="num orange">${st.pending}</div><div class="lbl">Pending</div></div>
        <div class="stat" onclick="setView('not_found',document.querySelector('[data-v=\"not_found\"]'))"><div class="num red">${st.notfound}</div><div class="lbl">Not Found</div></div>
        <div class="stat" onclick="setView('needs_review',document.querySelector('[data-v=\"needs_review\"]'))"><div class="num red">${st.notfound + st.pending}</div><div class="lbl">Needs Review</div></div>
    </div>`;

    // Controls
    html += `<div class="ctrl">
        <input type="text" placeholder="Search by name, category, email..." value="${searchQ}" oninput="setQ(this.value)">
        <select onchange="setPP(parseInt(this.value))">
            <option value="25" ${perPage===25?'selected':''}>25 / page</option>
            <option value="50" ${perPage===50?'selected':''}>50 / page</option>
            <option value="100" ${perPage===100?'selected':''}>100 / page</option>
        </select>
        <span class="count">${filtered.length} results</span>
    </div>`;

    // Table
    html += '<div class="tw"><table><thead><tr>';
    const cols = [{k:'id',l:'#'},{k:'name',l:'Business'},{k:'cat',l:'Category'},{k:null,l:'Status'},{k:null,l:'Current Website'},{k:null,l:'Correct Website'},{k:null,l:'Action'}];
    cols.forEach(c => {
        if (c.k) html += `<th onclick="setSort('${c.k}')">${c.l} <span style="font-size:9px;margin-left:2px">${sortCol===c.k?(sortDir===1?'▲':'▼'):''}</span></th>`;
        else html += `<th>${c.l}</th>`;
    });
    html += '</tr></thead><tbody>';

    if (filtered.length === 0) {
        html += `<tr><td colspan="7"><div style="text-align:center;padding:40px;color:#555"><h3 style="color:#777;margin-bottom:4px">Nothing to show</h3><p>Try a different filter</p></div></td></tr>`;
    } else {
        pageData.forEach(d => {
            const statusLabel = d.vstatus === 'found' ? 'Verified' : d.vstatus === 'not_found' ? 'Not Found' : d.vstatus === 'skipped' ? 'Already Good' : 'Pending';
            const currentWeb = d.website || '';
            const editVal = edits[d.id] !== undefined ? edits[d.id] : (d.vwebsite || currentWeb);
            const isCorrect = editVal === currentWeb && currentWeb !== '';
            
            html += `<tr>
                <td style="color:#555;font-size:12px">${d.id}</td>
                <td><strong style="color:#eee;font-size:13px">${d.name}</strong></td>
                <td style="color:#888;font-size:12px">${d.cat}</td>
                <td><span class="pill ${d.vstatus}">${statusLabel}</span></td>
                <td style="font-size:12px;word-break:break-all;max-width:180px">${currentWeb ? `<a href="${currentWeb}" target="_blank" style="color:#4FC3F7;text-decoration:none">${currentWeb.substring(0,35)}</a>` : '<span style="color:#ef5350">—</span>'}</td>
                <td style="max-width:200px"><input class="website-input ${isCorrect?'correct':''}" type="text" value="${editVal}" onchange="updateEdit(${d.id}, this.value)" placeholder="Enter correct website..."></td>
                <td><button class="search-btn" onclick="searchGoogle('${d.name.replace(/'/g,"'")}','${d.cat.replace(/'/g,"'")}')">🔍 Search</button> <button class="save-btn" onclick="saveWebsite(${d.id})">Save</button></td>
            </tr>`;
        });
    }

    html += '</tbody></table>';

    // Pagination
    if (filtered.length > 0) {
        const pStart = Math.max(0, page - 2), pEnd = Math.min(pages, pStart + 5);
        html += `<div class="pag"><span>${start+1}-${end} of ${filtered.length}</span><div class="btns">
            <button onclick="goP(0)" ${page===0?'disabled':''}>«</button>
            <button onclick="goP(${page-1})" ${page===0?'disabled':''}>‹</button>`;
        for (let i = pStart; i < pEnd; i++) html += `<button class="${i===page?'on':''}" onclick="goP(${i})">${i+1}</button>`;
        html += `<button onclick="goP(${page+1})" ${page>=pages-1?'disabled':''}>›</button>
            <button onclick="goP(${pages-1})" ${page>=pages-1?'disabled':''}>»</button>
        </div></div>`;
    }

    document.getElementById('main').innerHTML = html + '</div>';
}

function setView(v, el) {
    view = v; page = 0;
    document.querySelectorAll('.side-item').forEach(e => e.classList.remove('active'));
    if (el) el.classList.add('active');
    render();
}

function setQ(v) { searchQ = v.toLowerCase(); page = 0; render(); }
function setSort(col) { if (sortCol === col) sortDir *= -1; else { sortCol = col; sortDir = 1; } render(); }
function goP(p) { page = p; render(); document.querySelector('.tw').scrollIntoView({behavior:'smooth',block:'start'}); }
function setPP(v) { perPage = v; page = 0; render(); }
function updateEdit(id, val) { edits[id] = val; render(); }

function saveWebsite(id) {
    const d = allData.find(x => x.id === id);
    if (!d) return;
    const newWeb = (edits[id] || d.vwebsite || d.website || '').trim();
    if (!newWeb) { showToast('Please enter a website'); return; }
    
    // Persist to localStorage
    let saved = JSON.parse(localStorage.getItem('verifiedWebsites') || '{}');
    saved[id] = { website: newWeb, name: d.name, cat: d.cat, verifiedAt: new Date().toISOString() };
    localStorage.setItem('verifiedWebsites', JSON.stringify(saved));
    
    // Mark local
    d.vstatus = 'found';
    d.vwebsite = newWeb;
    if (!edits[id]) edits[id] = newWeb;
    
    showToast('✅ Saved: ' + newWeb);
    render();
}

function searchGoogle(name, cat) {
    const query = encodeURIComponent(`${name} ${cat} Kigali Rwanda`);
    window.open(`https://www.google.com/search?q=${query}`, '_blank');
    showToast('🔍 Google search opened in new tab');
}

function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(t._timeout);
    t._timeout = setTimeout(() => t.classList.remove('show'), 2500);
}

render();
</script>
</body>
</html>
